name: Validate and build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements.txt

      - name: Validate datasets and links
        run: python scripts/validate.py

      - name: Verify generated glossary is current
        run: python scripts/generate_glossary.py --check

      - name: Run tests
        run: pytest

      - name: Build documentation
        run: mkdocs build --strict

      - name: Finalize language metadata
        run: python scripts/postprocess_site.py

      - name: Verify localization and search metadata
        run: python scripts/verify_site.py
