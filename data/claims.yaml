  - id: security_txt_is_not_permission
    term_ids: [security_txt, vulnerability_disclosure_policy]
    claim_type: authorization_boundary
    text_en: A security.txt file aids contact and policy discovery; its presence or absence does not grant or deny testing permission.
    text_lv: security.txt palīdz atrast kontaktu un politiku; faila esamība vai neesamība nedod un neatņem testēšanas atļauju.
    citations:
