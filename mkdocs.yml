site_name: Cyber Roles, Authorization & Evidence
site_description: Bilingual Latvian-English reference for cybersecurity roles, authorization and evidence
site_author: Zigmārs Ancveirs
site_url: https://ancveirs-lv.github.io/cyber-roles-authorization-evidence/
repo_name: cyber-roles-authorization-evidence
repo_url: https://github.com/ancveirs-lv/cyber-roles-authorization-evidence
edit_uri: edit/main/docs/
copyright: Text and data © Zigmārs Ancveirs, CC BY 4.0

theme:
  name: material
  custom_dir: docs/overrides
  language: en
  palette:
    scheme: default
    primary: black
    accent: grey
  features:
    - navigation.indexes
    - navigation.sections
    - content.action.edit
    - content.code.copy
    - search.highlight

extra_css:
  - assets/styles.css

plugins:
  - search
  - i18n:
      docs_structure: folder
      fallback_to_default: false
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: lv
          name: Latviešu
          build: true
          site_name: Kiberdrošības lomas, pilnvarojums un pierādījumi
          site_description: Divvalodu atsauce par kiberdrošības lomām, pilnvarojumu un pierādījumiem
          nav_translations:
            Home: Sākums
            Terminology: Terminoloģija
            Team colours: Komandu krāsas
            CVD, VDP, Bug Bounty and pentesting: CVD, VDP, Bug Bounty un pentests
            Role, authorization and evidence: Loma, pilnvarojums un pierādījumi
            Evaluating public claims: Publisku apgalvojumu pārbaude
            Incident commentary risk: Incidentu komentēšanas risks
            Quick reference: Īsā atsauce
            Historical and community jargon: Vēsturiskais un kopienas žargons
            Evidence register: Pierādījumu reģistrs
            Methodology: Metodoloģija
            Complete glossary: Pilnā vārdnīca

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Terminology: terminology.md
  - Complete glossary: glossary.md
  - Team colours: teams.md
  - CVD, VDP, Bug Bounty and pentesting: vulnerability-programs.md
  - Role, authorization and evidence: role-authorization-evidence.md
  - Evaluating public claims: public-claims-checklist.md
  - Incident commentary risk: incident-commentary.md
  - Quick reference: quick-reference.md
  - Historical and community jargon: jargon.md
  - Evidence register: evidence-register.md
  - Methodology: methodology.md

strict: true
